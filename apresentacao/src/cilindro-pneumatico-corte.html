<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cilindro pneumático em corte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;750&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1F4; --surface:#FFFFFF; --ink:#1C2329; --muted:#5B6873; --line:#C9D2DA;
  --steel:#8E9AA4; --steelDark:#66737D; --alu:#C9D2D9; --rod:#E3E8EC; --rodStroke:#7D8A94;
  --airP:#2F7FD1; --airAtm:#DCE9F6; --sel:#E2A200; --magnet:#A8483A; --bronze:#B08D57; --seal:#2B3238;
  --spring:#3C4A55; --chip:#E4EAF0;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12171C; --surface:#1A2128; --ink:#E6EBEF; --muted:#97A4AE; --line:#2E3943;
    --steel:#5E6A74; --steelDark:#47525B; --alu:#7D8A94; --rod:#B3BDC4; --rodStroke:#5E6A74;
    --airP:#4A97E6; --airAtm:#233A50; --sel:#F2B705; --magnet:#C2604F; --bronze:#B99862; --seal:#0C1013;
    --spring:#C3CDD4; --chip:#24303A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#12171C; --surface:#1A2128; --ink:#E6EBEF; --muted:#97A4AE; --line:#2E3943;
  --steel:#5E6A74; --steelDark:#47525B; --alu:#7D8A94; --rod:#B3BDC4; --rodStroke:#5E6A74;
  --airP:#4A97E6; --airAtm:#233A50; --sel:#F2B705; --magnet:#C2604F; --bronze:#B99862; --seal:#0C1013;
  --spring:#C3CDD4; --chip:#24303A;
  color-scheme: dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Archivo",system-ui,"Segoe UI",Roboto,Arial,sans-serif;font-size:17px;line-height:1.5}
.wrap{max-width:1180px;margin:0 auto;padding:28px 20px 48px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px 32px;margin-bottom:18px}
h1{font-size:clamp(1.7rem,3.4vw,2.5rem);font-weight:750;letter-spacing:-0.02em;line-height:1.1;margin:0}
.sub{margin:6px 0 0;color:var(--muted);max-width:60ch}
.tabs{display:inline-flex;background:var(--chip);border-radius:999px;padding:4px}
.tabs button{font:inherit;font-weight:600;border:0;background:transparent;color:var(--muted);padding:9px 20px;border-radius:999px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
button:focus-visible{outline:3px solid var(--sel);outline-offset:2px}
.stage{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 10px 0;overflow-x:auto}
.stage svg{display:block;width:100%;min-width:720px;height:auto}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:14px 8px 16px;border-top:1px solid var(--line);margin-top:4px}
.btn{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:9px 16px;border-radius:8px;cursor:pointer}
.btn:hover:not(:disabled){border-color:var(--muted)}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--airP);border-color:var(--airP);color:#fff}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
.chip{background:var(--chip);border-radius:6px;padding:5px 10px;font-size:.88rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip b{font-weight:600}
.dot{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.status{width:100%;margin:0;color:var(--muted);min-height:3em}
.grid{display:grid;grid-template-columns:minmax(260px,1fr) minmax(300px,1.35fr);gap:20px;margin-top:20px}
@media (max-width:820px){.grid{grid-template-columns:1fr}}
.legend{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:6px}
@media (max-width:480px){.legend{grid-template-columns:1fr}}
.legend button{width:100%;text-align:left;font:inherit;font-size:.95rem;display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:7px 10px;cursor:pointer}
.legend button .n{flex:none;width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--surface);display:grid;place-items:center;font-weight:600;font-size:.85rem}
.legend button[aria-pressed="true"]{border-color:var(--sel);box-shadow:inset 0 0 0 1px var(--sel)}
.legend button[aria-pressed="true"] .n{background:var(--sel);color:#1C2329}
.detail{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px 22px}
.detail h2{margin:0;font-size:1.45rem;letter-spacing:-0.01em;line-height:1.2}
.detail .aka{margin:4px 0 12px;color:var(--muted);font-size:.92rem}
.detail p{margin:0 0 12px;max-width:68ch}
.detail h3{font-size:.95rem;font-weight:600;margin:16px 0 4px;color:var(--muted)}
.notes{margin-top:20px;display:grid;grid-template-columns:auto 1fr;gap:18px 24px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 22px}
@media (max-width:620px){.notes{grid-template-columns:1fr}}
.notes svg{width:220px;height:auto}
.notes p{margin:0 0 8px;max-width:70ch}
.notes p:last-child{margin:0}
.notes .cap{font-size:.85rem;color:var(--muted);margin-top:4px;text-align:center}

/* SVG */
.p-alu{fill:var(--alu);stroke:var(--steelDark);stroke-width:1.2}
.p-steel{fill:var(--steel);stroke:var(--steelDark);stroke-width:1.2}
.p-rod{fill:var(--rod);stroke:var(--rodStroke);stroke-width:1.2}
.p-seal{fill:var(--seal)}
.p-mag{fill:var(--magnet)}
.p-bronze{fill:var(--bronze)}
.p-guide{fill:#E9DDB3;stroke:var(--steelDark);stroke-width:.8}
.p-spring{fill:none;stroke:var(--spring);stroke-width:3.2;stroke-linejoin:round}
.hatch{stroke:var(--rodStroke);stroke-width:1.2}
.hose{stroke:var(--steelDark);stroke-width:9;stroke-linecap:round;fill:none}
.filter{fill:var(--surface);stroke:var(--steelDark);stroke-width:1.2;stroke-dasharray:2 2}
.air{transition:fill .25s}
.air.p{fill:var(--airP);fill-opacity:.62}
.air.a{fill:var(--airAtm)}
.flow{fill:none;stroke:var(--airP);stroke-width:3;stroke-dasharray:7 9;opacity:0}
.flow.out{stroke:var(--muted)}
.flow.on{opacity:1;animation:dash .6s linear infinite}
@keyframes dash{to{stroke-dashoffset:-16}}
.leader{stroke:var(--muted);stroke-width:1;fill:none}
.mk{cursor:pointer}
.mk circle{fill:var(--ink);stroke:var(--surface);stroke-width:2}
.mk text{fill:var(--surface);font:600 13px "Archivo",system-ui,sans-serif;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.mk.sel circle{fill:var(--sel)}
.mk.sel text{fill:#1C2329}
.mk:focus{outline:none}
.mk:focus-visible circle{stroke:var(--sel);stroke-width:4}
[data-part].hl{stroke:var(--sel)!important;stroke-width:3.5!important}
.p-spring.hl{stroke-width:4.5!important}
.lbl{fill:var(--muted);font:500 12px "Archivo",system-ui,sans-serif}
@media (prefers-reduced-motion: reduce){.flow.on{animation:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Cilindro pneumático em corte</h1>
      <p class="sub">Toque num número no desenho ou na lista para ver o nome e a função da peça. Use os botões para avançar e recuar a haste.</p>
    </div>
    <div class="tabs" role="tablist" aria-label="Tipo de cilindro">
      <button role="tab" id="tab-sa" aria-selected="true" data-mode="sa">Simples ação</button>
      <button role="tab" id="tab-da" aria-selected="false" data-mode="da">Dupla ação</button>
    </div>
  </header>

  <section class="stage" aria-label="Desenho do cilindro em corte">
    <div id="svgHost"></div>
    <div class="controls">
      <button class="btn primary" id="bAv">Avançar</button>
      <button class="btn" id="bRe">Recuar</button>
      <button class="btn" id="bCy" aria-pressed="false">Ciclo contínuo</button>
      <div class="chips">
        <span class="chip"><span class="dot" style="background:var(--airP)"></span>Pressão (6 bar)</span>
        <span class="chip"><span class="dot" style="background:var(--airAtm);outline:1px solid var(--line)"></span>Atmosfera (0 bar)</span>
        <span class="chip" id="pT">Câmara traseira: <b>0 bar</b></span>
        <span class="chip" id="pD">Câmara dianteira: <b>0 bar</b></span>
      </div>
      <p class="status" id="status" aria-live="polite"></p>
    </div>
  </section>

  <div class="grid">
    <ol class="legend" id="legend" aria-label="Peças"></ol>
    <article class="detail" id="detail" aria-live="polite"></article>
  </div>

  <section class="notes" id="notes"></section>
</div>

<script>
(function(){
const STROKE = 320;            // curso em px no desenho
const DUR = 1700;              // ms por movimento
const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- Conteúdo ---------- */
const PARTS = {
  cabT:{nome:"Cabeçote traseiro",aka:"também chamado de tampa traseira",
    funcao:{sa:"Fecha a extremidade traseira da camisa e recebe o pórtico de alimentação. É também o ponto de fixação traseiro do cilindro (pés, flange ou articulação).",
            da:"Fecha a extremidade traseira da camisa e recebe o pórtico traseiro. No cilindro com amortecimento, abriga a câmara de amortecimento e o parafuso de regulagem traseiro."},
    aula:"Em cilindros normalizados (ISO 15552), os dois cabeçotes são presos à camisa por tirantes ou por parafusos nos canais do perfil de alumínio."},
  portT:{nome:"Pórtico traseiro",aka:"conexão de ar, via ou orifício de alimentação",
    funcao:{sa:"É o único ponto de ar comprimido do cilindro. No avanço, o ar entra por ele; no retorno, a mola empurra o êmbolo e o mesmo ar sai por ele até o escape da válvula direcional.",
            da:"Alimenta a câmara traseira. No avanço, recebe ar da válvula; no retorno, é por ele que o ar da câmara traseira escapa pela válvula."},
    aula:"A velocidade é regulada nesse ponto com válvulas reguladoras de fluxo montadas no próprio pórtico, geralmente estrangulando o ar que sai (meter-out)."},
  amort:{nome:"Amortecimento de fim de curso",aka:"luva de amortecimento, vedação e parafuso de regulagem (nos dois cabeçotes)",
    funcao:{da:"Perto do fim do curso, a luva presa ao êmbolo entra na cavidade do cabeçote e fecha a saída livre do ar. O ar que sobrou fica preso e só escapa por um furo pequeno, regulado pelo parafuso. Isso forma um colchão de ar que desacelera o êmbolo antes de bater na tampa."},
    eletro:"Funciona como uma descarga RC: o volume de ar preso é o “capacitor” e o parafuso é o “resistor”. Quanto mais fechado o parafuso, maior o R e mais lenta a desaceleração.",
    aula:"Parafuso todo fechado faz o cilindro travar antes do fim do curso; todo aberto deixa a batida forte. Regule com a carga real montada."},
  camisa:{nome:"Camisa",aka:"tubo do cilindro",
    funcao:{sa:"Tubo onde o êmbolo desliza. Hoje é quase sempre um perfil de alumínio anodizado, com o interior brunido (bem liso) para a vedação durar.",
            da:"Tubo onde o êmbolo desliza e que forma, com os cabeçotes, as duas câmaras de ar. Hoje é quase sempre um perfil de alumínio anodizado, com o interior brunido (bem liso) para a vedação durar."},
    aula:"Os canais externos do perfil servem para prender os sensores magnéticos. Riscos internos na camisa (sujeira, cavaco) destroem a vedação do êmbolo."},
  vedEmb:{nome:"Vedação do êmbolo",aka:"gaxeta ou guarnição, normalmente de poliuretano ou NBR",
    funcao:{sa:"Um lábio voltado para o lado pressurizado impede que o ar passe da câmara traseira para o lado da mola. Uma só basta, porque só um lado recebe pressão.",
            da:"Duas vedações (ou uma de duplo lábio) isolam as câmaras nos dois sentidos. Se uma delas vazar, o ar passa de uma câmara para a outra e o cilindro perde força e velocidade."},
    eletro:"É o isolamento entre dois nós do circuito. Se falha, há uma “fuga” de um lado para o outro e o ponto perde pressão, como um nó perde tensão com uma fuga de corrente.",
    aula:"Sintoma típico de vedação do êmbolo gasta: com o cilindro parado e pressurizado, o escape da válvula fica soprando sem parar."},
  guia:{nome:"Anel-guia do êmbolo",aka:"fita-guia ou anel de desgaste",
    funcao:{sa:"Centraliza o êmbolo dentro da camisa e evita contato de metal com metal. Não veda nada; só guia.",
            da:"Centraliza o êmbolo dentro da camisa e evita contato de metal com metal. Não veda nada; só guia."},
    aula:"Os alunos costumam confundir com a vedação. A diferença é a função: a vedação segura o ar, o anel-guia segura o alinhamento."},
  embolo:{nome:"Êmbolo",aka:"também chamado de pistão",
    funcao:{sa:"Recebe a pressão do ar e a transforma em força: F = p × A. No avanço, parte dessa força é gasta para comprimir a mola.",
            da:"Recebe a pressão do ar dos dois lados e a transforma em força: F = p × A. No retorno, a área útil é menor, porque a haste ocupa parte dela (área anular)."},
    aula:"Exemplo para o quadro: êmbolo de 50 mm a 6 bar (0,6 MPa). A = π × 25² ≈ 1 963 mm², então F ≈ 0,6 × 1 963 ≈ 1 178 N, perto de 120 kgf. Na prática, o atrito tira cerca de 10%."},
  ima:{nome:"Ímã permanente",aka:"anel magnético do êmbolo",
    funcao:{sa:"Anel magnético montado no êmbolo. Permite saber a posição da haste com sensores magnéticos presos por fora da camisa, sem furar nada.",
            da:"Anel magnético montado no êmbolo. Permite saber a posição da haste com sensores magnéticos presos por fora da camisa, sem furar nada."},
    eletro:"É o mesmo princípio do sensor de porta de alarme: o ímã se aproxima e fecha as lâminas de um reed switch. Há também sensores de efeito Hall, sem partes móveis.",
    aula:"Cilindro sem ímã não aciona sensor magnético. Confira o código do catálogo antes de comprar."},
  mola:{nome:"Mola de retorno",aka:"exclusiva do cilindro de simples ação",
    funcao:{sa:"Devolve o êmbolo à posição inicial quando o ar é descarregado. Em compensação, rouba parte da força do avanço (o ar precisa vencer a mola) e ocupa espaço, por isso esses cilindros costumam ter curso curto."},
    eletro:"Faz o mesmo papel da mola de um botão pulsador ou da armadura de um relé: sem energia, volta sozinha à posição de repouso.",
    aula:"Se faltar ar, a mola recua a haste. Essa posição segura e previsível é um dos motivos para escolher simples ação em fixações e travas."},
  respiro:{nome:"Respiro com filtro",aka:"orifício de ventilação da câmara da mola",
    funcao:{sa:"A câmara da mola fica ligada à atmosfera. No avanço, o ar dessa câmara sai pelo respiro; no retorno, entra por ele. O elemento sinterizado impede a entrada de sujeira."},
    aula:"Respiro entupido faz o cilindro ficar lento ou parar no meio do curso, porque a câmara da mola passa a ser comprimida."},
  portD:{nome:"Pórtico dianteiro",aka:"conexão de ar da câmara dianteira",
    funcao:{da:"Alimenta a câmara dianteira para o retorno. No avanço, é por ele que o ar da frente escapa até a válvula."},
    aula:"Com a mesma pressão, o retorno é mais fraco que o avanço: a pressão atua só na área anular (área do êmbolo menos a área da haste)."},
  cabD:{nome:"Cabeçote dianteiro",aka:"também chamado de tampa dianteira",
    funcao:{sa:"Fecha a frente da camisa e aloja a bucha-guia e o anel raspador. A haste atravessa por ele.",
            da:"Fecha a frente da camisa e aloja a bucha-guia, a vedação da haste, o raspador e o amortecimento dianteiro. A haste atravessa por ele."},
    aula:"É aqui que fica a maior parte do kit de reparo. Trocar as vedações do cabeçote dianteiro é a manutenção mais comum em cilindros."},
  vedHaste:{nome:"Vedação da haste",aka:"gaxeta da haste",
    funcao:{da:"Impede que o ar da câmara dianteira, pressurizada no retorno, escape pela folga da haste."},
    aula:"No cilindro de simples ação desta página ela não aparece: a câmara da frente fica na pressão atmosférica, então só o raspador protege a haste. Faça os alunos perceberem essa diferença."},
  bucha:{nome:"Bucha-guia da haste",aka:"de bronze sinterizado ou aço com PTFE",
    funcao:{sa:"Sustenta e alinha a haste no cabeçote, absorvendo pequenos esforços laterais.",
            da:"Sustenta e alinha a haste no cabeçote, absorvendo pequenos esforços laterais."},
    aula:"Carga lateral na haste desgasta a bucha de forma oval e, em seguida, a vedação. Por isso se usam acoplamentos flutuantes e guias externas."},
  raspador:{nome:"Anel raspador",aka:"limpador da haste",
    funcao:{sa:"Raspa poeira, cavaco e líquidos da haste quando ela recua, para a sujeira não entrar no cilindro.",

    aula:"Também é chamado de “retentor limpador”. Em ambientes com solda ou cavaco, existem raspadores metálicos."},
  haste:{nome:"Haste",aka:"aço cromado ou inox, retificada",
    funcao:{sa:"Transmite a força do êmbolo para a máquina. Na ponta tem rosca para acoplar garfo, ponteira ou rótula.",

    aula:"A haste deve trabalhar só com esforço axial. Risco ou amassado na haste destrói a vedação em poucos ciclos."}

const MODES = {
  sa:{ order:["cabT","portT","camisa","vedEmb","guia","embolo","ima","mola","respiro","cabD","bucha","raspador","haste"],
       notes:`<div><svg viewBox="0 0 220 110" aria-label="Símbolo do cilindro de simples ação com retorno por mola">${symSA()}</svg><div class="cap">Símbolo (ISO 1219)</div></div>

       <p>Força de avanço ≈ p × A − força da mola. Consome metade do ar de um cilindro de dupla ação com o mesmo curso.</p>
       <p>Usos típicos: fixar, prender, travar e ejetar peças pequenas. No FluidSIM, é comandado por uma válvula 3/2 vias.</p></div>` },
  da:{ order:["cabT","portT","amort","camisa","vedEmb","guia","embolo","ima","portD","cabD","vedHaste","bucha","raspador","haste"],

const TXT = {
  sa:{ rest:"Em repouso: a câmara traseira está sem pressão e a mola mantém a haste recuada.",

  da:{ rest:"Recuado: a válvula mantém a câmara dianteira pressurizada, o que segura a haste recuada.",
       adv:"Avanço: o ar entra pelo pórtico traseiro. O ar da câmara dianteira é expulso pelo pórtico dianteiro até o escape da válvula. Perto do fim, o amortecimento freia o êmbolo.",
       ext:"Avançado: a câmara traseira continua pressurizada e mantém a haste estendida.",
       ret:"Retorno: o ar entra pelo pórtico dianteiro e atua na área anular. A câmara traseira descarrega pelo pórtico traseiro." }
};

/* ---------- Símbolos ISO ---------- */
function symSA(){
  let z="";for(let i=0;i<8;i++){z+=`${120+i*10},${i%2?32:68} `;}
  return `<g fill="none" stroke="currentColor" stroke-width="2.2" style="color:var(--ink)">
  <rect x="20" y="25" width="180" height="50"/><line x1="60" y1="25" x2="60" y2="75" stroke-width="4"/>
  <line x1="60" y1="50" x2="215" y2="50" stroke-width="4"/>
  <polyline points="62,50 ${z} 198,50" stroke-width="1.8"/>
  <line x1="30" y1="75" x2="30" y2="100"/><circle cx="30" cy="100" r="3" fill="currentColor"/></g>`;
}
function symDA(){
  return `<g fill="none" stroke="currentColor" stroke-width="2.2" style="color:var(--ink)">
  <rect x="20" y="25" width="180" height="50"/><line x1="80" y1="25" x2="80" y2="75" stroke-width="4"/>
  <line x1="80" y1="50" x2="215" y2="50" stroke-width="4"/>
  <rect x="20" y="40" width="14" height="20"/><rect x="186" y="40" width="14" height="20"/>
  <line x1="27" y1="66" x2="40" y2="34" stroke-width="1.6"/><line x1="193" y1="66" x2="180" y2="34" stroke-width="1.6"/>
  <line x1="45" y1="75" x2="45" y2="100"/><line x1="175" y1="75" x2="175" y2="100"/>
  <circle cx="45" cy="100" r="3" fill="currentColor"/><circle cx="175" cy="100" r="3" fill="currentColor"/></g>`;
}

/* ---------- Desenho ---------- */
function buildSVG(mode){
  const da = mode==="da";
  const nums = {}; MODES[mode].order.forEach((k,i)=>nums[k]=i+1);
  let s = `<svg viewBox="0 0 1100 390" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Cilindro de ${da?"dupla":"simples"} ação em corte">`;
  // câmaras de ar
  s += `<rect id="chT" class="air a" x="140" y="130" width="10" height="140"/>`;
  s += `<rect id="chD" class="air a" x="214" y="130" width="346" height="140"/>`;
  // camisa
  s += `<rect data-part="camisa" class="p-alu" x="140" y="110" width="420" height="20"/>`;
  s += `<rect data-part="camisa" class="p-alu" x="140" y="270" width="420" height="20"/>`;
  // cabeçote traseiro
  s += `<rect data-part="cabT" class="p-steel" x="56" y="104" width="84" height="192" rx="4"/>`;
  // canal traseiro
  s += `<path id="cnT" class="air a" d="M84,104 H92 V142 H140 V150 H84 Z"/>`;
  if(da){
    s += `<rect id="cvT" class="air a" x="120" y="184" width="20" height="32"/>`;
    s += `<rect data-part="amort" class="p-seal" x="116" y="182" width="4" height="36"/>`;
    s += `<g data-part="amort"><rect class="p-steel" data-part="amort" x="112" y="94" width="12" height="10"/><line x1="118" y1="104" x2="118" y2="184" class="leader" stroke-dasharray="3 3"/></g>`;
  }
  // cabeçote dianteiro (duas metades, a haste passa entre elas)
  s += `<path data-part="cabD" class="p-steel" d="M560,104 H646 Q650,104 650,108 V182 H560 Z"/>`;
  s += `<path data-part="cabD" class="p-steel" d="M560,218 H650 V292 Q650,296 646,296 H560 Z"/>`;
  // canal dianteiro
  s += `<path id="cnD" class="air a" d="M604,104 H612 V150 H560 V142 H604 Z"/>`;
  if(da){
    s += `<rect id="cvD" class="air a" x="560" y="174" width="26" height="52"/>`;
    s += `<rect data-part="amort" class="p-seal" x="584" y="174" width="3" height="52"/>`;
    s += `<g data-part="amort"><rect class="p-steel" data-part="amort" x="568" y="94" width="12" height="10"/><line x1="574" y1="104" x2="574" y2="174" class="leader" stroke-dasharray="3 3"/></g>`;
    s += `<rect data-part="vedHaste" class="p-seal" x="589" y="174" width="9" height="8"/><rect data-part="vedHaste" class="p-seal" x="589" y="218" width="9" height="8"/>`;
  }
  s += `<rect data-part="bucha" class="p-bronze" x="600" y="171" width="36" height="11"/><rect data-part="bucha" class="p-bronze" x="600" y="218" width="36" height="11"/>`;
  s += `<path data-part="raspador" class="p-seal" d="M638,174 H650 V182 H642 Z"/><path data-part="raspador" class="p-seal" d="M638,226 H650 V218 H642 Z"/>`;
  // conexões
  s += `<path class="hose" d="M88,70 V18"/>`;
  s += `<rect data-part="portT" class="p-steel" x="76" y="70" width="24" height="34" rx="3"/>`;
  if(da){
    s += `<path class="hose" d="M608,70 V18"/>`;
    s += `<rect data-part="portD" class="p-steel" x="596" y="70" width="24" height="34" rx="3"/>`;
  } else {
    s += `<rect data-part="respiro" class="p-steel" x="596" y="80" width="24" height="24" rx="3"/>`;
    s += `<rect data-part="respiro" class="filter" x="598" y="58" width="20" height="22" rx="3"/>`;
  }
  // mola
  if(!da) s += `<polyline id="spring" data-part="mola" class="p-spring" points=""/>`;
  // conjunto móvel
  s += `<g id="mov">`;
  if(da){
    s += `<rect data-part="amort" class="p-alu" x="128" y="188" width="22" height="24" rx="2"/>`;
    s += `<rect data-part="amort" class="p-alu" x="214" y="176" width="30" height="48" rx="2"/>`;
  }
  s += `<rect data-part="haste" class="p-rod" x="214" y="182" width="540" height="36" rx="3"/>`;
  for(let x=726;x<=750;x+=6) s += `<line class="hatch" x1="${x}" y1="182" x2="${x-6}" y2="218"/>`;
  s += `<rect data-part="embolo" class="p-alu" x="150" y="132" width="64" height="136" rx="3"/>`;
  s += `<rect data-part="ima" class="p-mag" x="164" y="142" width="36" height="12" rx="2"/><rect data-part="ima" class="p-mag" x="164" y="246" width="36" height="12" rx="2"/>`;
  s += `<rect data-part="guia" class="p-guide" x="177" y="130" width="12" height="5"/><rect data-part="guia" class="p-guide" x="177" y="265" width="12" height="5"/>`;
  s += `<path data-part="vedEmb" class="p-seal" d="M151,130 H161 L161,139 L156,136 Z"/><path data-part="vedEmb" class="p-seal" d="M151,270 H161 L161,261 L156,264 Z"/>`;
  if(da) s += `<path data-part="vedEmb" class="p-seal" d="M213,130 H203 L203,139 L208,136 Z"/><path data-part="vedEmb" class="p-seal" d="M213,270 H203 L203,261 L208,264 Z"/>`;
  s += `</g>`;
  // fluxo
  s += `<path id="fTin" class="flow" d="M88,16 V146 H146"/><path id="fTout" class="flow out" d="M146,146 H88 V16"/>`;
  if(da) s += `<path id="fDin" class="flow" d="M608,16 V146 H556"/><path id="fDout" class="flow out" d="M556,146 H608 V16"/>`;
  else s += `<path id="fDin" class="flow out" d="M608,40 V146 H556"/><path id="fDout" class="flow out" d="M556,146 H608 V40"/>`;
  // rótulos discretos das câmaras
  s += `<text class="lbl" x="350" y="380" text-anchor="middle">${da?"câmara traseira ← êmbolo → câmara dianteira":"câmara de pressão ← êmbolo → câmara da mola (atmosfera)"}</text>`;
  // marcadores
  let fixed="", mov="";
  MODES[mode].order.forEach(k=>{
    const m = MK[k];
    const g = `<line class="leader" x1="${m.ax}" y1="${m.ay}" x2="${m.mx}" y2="${m.my}"/>
      <g class="mk" data-mk="${k}" tabindex="0" role="button" aria-label="${nums[k]}: ${PARTS[k].nome}"><circle cx="${m.mx}" cy="${m.my}" r="13"/><text x="${m.mx}" y="${m.my}">${nums[k]}</text></g>`;
    if(m.m) mov+=g; else fixed+=g;
  });
  s += fixed + `<g id="movMk">${mov}</g></svg>`;
  return s;
}

/* ---------- Estado ---------- */
let mode="sa", pos=0, valve="ret", phase="rest", anim=null, cycle=false, selected=null;
const $ = id=>document.getElementById(id);

function setAir(el, p){ if(!el) return; el.classList.toggle("p",p); el.classList.toggle("a",!p); }
function flow(id,on){ const e=$(id); if(e) e.classList.toggle("on",on); }

function render(){
  const dx = STROKE*pos;
  $("mov").setAttribute("transform",`translate(${dx},0)`);
  $("movMk").setAttribute("transform",`translate(${dx},0)`);
  $("chT").setAttribute("width", 10+dx);
  const fx = 214+dx; $("chD").setAttribute("x",fx); $("chD").setAttribute("width",560-fx);
  if(mode==="sa"){
    const x0=fx, x1=560, n=9; let pts=`${x0},200 `;
    for(let i=1;i<2*n;i++){ pts+=`${x0+(x1-x0)*i/(2*n)},${i%2?136:264} `; }
    pts+=`${x1},200`; $("spring").setAttribute("points",pts);
  }
  const moving = phase==="adv"||phase==="ret";
  const tP = valve==="av";
  const dP = mode==="da" && valve==="ret";
  ["chT","cnT","cvT"].forEach(i=>setAir($(i),tP));
  ["chD","cnD","cvD"].forEach(i=>setAir($(i),dP));
  flow("fTin", moving && valve==="av");
  flow("fTout", moving && valve==="ret");
  flow("fDin", moving && valve==="ret");
  flow("fDout", moving && valve==="av");
  $("pT").innerHTML = `Câmara traseira: <b>${tP?"6 bar":"0 bar"}</b>`;
  $("pD").innerHTML = mode==="sa" ? `Câmara da mola: <b>0 bar (respiro)</b>` : `Câmara dianteira: <b>${dP?"6 bar":"0 bar"}</b>`;
  $("status").textContent = TXT[mode][phase];
  $("bAv").disabled = moving || pos>=1 || cycle;
  $("bRe").disabled = moving || pos<=0 || cycle;
}

function ease(t){ return t<.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2; }
function easeCush(t){ // dupla ação: desacelera mais no fim (amortecimento)
  return mode==="da" ? 1-Math.pow(1-t,3) : ease(t);
}
function move(to, done){
  valve = to===1 ? "av" : "ret";
  phase = to===1 ? "adv" : "ret";
  const from = pos, t0 = performance.now(), d = reduce ? 0 : DUR;
  cancelAnimationFrame(anim);
  const step = now=>{
    const t = d ? Math.min(1,(now-t0)/d) : 1;
    pos = from + (to-from)*easeCush(t);
    render();
    if(t<1){ anim=requestAnimationFrame(step); }
    else { pos=to; phase = to===1 ? "ext" : (mode==="da"?"rest":"rest"); render(); if(done) done(); }
  };
  anim=requestAnimationFrame(step);
}
function runCycle(){
  if(!cycle) return;
  const next = pos>=1 ? 0 : 1;
  move(next, ()=>setTimeout(runCycle, reduce?1200:700));
}

/* ---------- Seleção ---------- */
function select(k){
  selected = k;
  document.querySelectorAll("[data-part]").forEach(e=>e.classList.toggle("hl", e.getAttribute("data-part")===k));
  document.querySelectorAll(".mk").forEach(e=>e.classList.toggle("sel", e.dataset.mk===k));
  document.querySelectorAll(".legend button").forEach(b=>b.setAttribute("aria-pressed", b.dataset.k===k ? "true":"false"));
  const p = PARTS[k], n = MODES[mode].order.indexOf(k)+1;
  let h = `<h2>${n}. ${p.nome}</h2><p class="aka">${p.aka}</p><p>${p.funcao[mode]}</p>`;
  if(p.eletro) h += `<h3>Paralelo com a eletrônica</h3><p>${p.eletro}</p>`;
  if(p.aula) h += `<h3>Para comentar em aula</h3><p>${p.aula}</p>`;
  $("detail").innerHTML = h;
}

function setMode(m){
  mode=m; cycle=false; $("bCy").setAttribute("aria-pressed","false");
  cancelAnimationFrame(anim);
  pos=0; valve="ret"; phase="rest";
  document.querySelectorAll(".tabs button").forEach(b=>b.setAttribute("aria-selected", b.dataset.mode===m?"true":"false"));
  $("svgHost").innerHTML = buildSVG(m);
  $("legend").innerHTML = MODES[m].order.map((k,i)=>`<li><button data-k="${k}" aria-pressed="false"><span class="n">${i+1}</span>${PARTS[k].nome}</button></li>`).join("");
  $("notes").innerHTML = MODES[m].notes;
  document.querySelectorAll(".mk").forEach(g=>{
    g.addEventListener("click",()=>select(g.dataset.mk));
    g.addEventListener("keydown",e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); select(g.dataset.mk);} });
  });
  document.querySelectorAll(".legend button").forEach(b=>b.addEventListener("click",()=>select(b.dataset.k)));
  render();
  select(MODES[m].order.includes(selected) ? selected : "embolo");
}

document.querySelectorAll(".tabs button").forEach(b=>b.addEventListener("click",()=>setMode(b.dataset.mode)));
$("bAv").addEventListener("click",()=>move(1));
$("bRe").addEventListener("click",()=>move(0));
$("bCy").addEventListener("click",()=>{
  cycle=!cycle; $("bCy").setAttribute("aria-pressed", cycle?"true":"false");
  if(cycle && phase!=="adv" && phase!=="ret") runCycle(); else render();
});
setMode("sa");
})();
</script>
